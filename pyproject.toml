[project]
name = "acp-gateway"
version = "0.1.0"
description = "Local gateway that routes messages from external channels (Hermes, Telegram, ...) to ACP agents"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "Lujker" }]
keywords = ["acp", "agent-client-protocol", "goose", "gateway", "mcp", "hermes", "telegram"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Communications :: Chat",
    "Topic :: Software Development",
]
dependencies = [
    "agent-client-protocol[http]>=0.12",
    "aiogram>=3.22,<4",
    "fastapi>=0.115",
    "filelock>=3.16",
    "httpx>=0.28",
    "mcp>=1.20,<2",
    "platformdirs>=4.3",
    "pydantic>=2.10",
    "pydantic-settings[yaml]>=2.8",
    "python-dotenv>=1.0",
    "structlog>=25.1",
    "uvicorn>=0.34",
    "websockets>=15",
]

[project.urls]
Homepage = "https://github.com/Lujker/acp-gateway"
Repository = "https://github.com/Lujker/acp-gateway"
Issues = "https://github.com/Lujker/acp-gateway/issues"

[project.scripts]
acpgw = "acp_gateway.cli.main:main"

[dependency-groups]
build = [
    "pyinstaller>=6.16,<7",
]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "ruff>=0.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/acp_gateway"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM", "S", "RUF", "PTH"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S603", "S607"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["scripts", "tests"]
asyncio_mode = "auto"
addopts = "-ra --strict-markers"
