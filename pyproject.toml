[project]
name = "acp-gateway"
version = "0.1.0"
description = "Local gateway that routes messages from external channels (Hermes, Telegram, ...) to ACP agents"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "platformdirs>=4.3",
    "pydantic>=2.10",
    "pydantic-settings[yaml]>=2.8",
    "python-dotenv>=1.0",
    "structlog>=25.1",
]

[project.scripts]
acpgw = "acp_gateway.cli.main:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "ruff>=0.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/acp_gateway"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM", "S", "RUF", "PTH"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S603", "S607"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["scripts"]
asyncio_mode = "auto"
addopts = "-ra --strict-markers"
