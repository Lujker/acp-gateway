name: Platform release checks

on:
  workflow_dispatch:
    inputs:
      publish_image:
        description: 'Publish the tested Docker image to GHCR (manual release)'
        required: false
        type: boolean
        default: false
      publish_pypi:
        description: 'Verify or publish wheel/sdist from an existing GitHub Release'
        required: false
        type: boolean
        default: false
      pypi_dry_run:
        description: 'Verify release files without uploading to PyPI'
        required: false
        type: boolean
        default: true
      release_tag:
        description: 'Existing release tag for PyPI (files are never rebuilt)'
        required: false
        type: string
        default: 'v0.1.0'

permissions:
  contents: read

jobs:
  publish-pypi:
    if: ${{ inputs.publish_pypi }}
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    environment: pypi
    concurrency:
      group: pypi-release
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download published release files
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        shell: bash
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo 'Expected a stable version tag such as v0.1.0' >&2
            exit 1
          fi
          gh release view "$RELEASE_TAG" --json isDraft --jq '.isDraft' | grep -qx false
          version="${RELEASE_TAG#v}"
          mkdir -p publish-dist release-manifest
          gh release download "$RELEASE_TAG" --dir release-manifest --pattern SHA256SUMS
          gh release download "$RELEASE_TAG" --dir publish-dist \
            --pattern "acp_gateway-$version-py3-none-any.whl" \
            --pattern "acp_gateway-$version.tar.gz"
      - name: Verify both distribution checksums
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          python3 - <<'PY'
          import hashlib
          import os
          from pathlib import Path

          version = os.environ['RELEASE_TAG'][1:]
          expected = {f'acp_gateway-{version}-py3-none-any.whl', f'acp_gateway-{version}.tar.gz'}
          files = list(Path('publish-dist').iterdir())
          if {p.name for p in files} != expected:
              raise SystemExit('Release must contain exactly the selected wheel and sdist')
          sums = {}
          for line in Path('release-manifest/SHA256SUMS').read_text().splitlines():
              digest, name = line.split(maxsplit=1)
              if name in sums:
                  raise SystemExit(f'Duplicate checksum entry: {name}')
              sums[name] = digest
          for path in files:
              digest = hashlib.sha256(path.read_bytes()).hexdigest()
              if sums.get(path.name) != digest:
                  raise SystemExit(f'Checksum mismatch or missing entry: {path.name}')
              print(f'Verified {path.name}: {digest}')
          PY
      - name: Publish verified files using Trusted Publishing
        if: ${{ !inputs.pypi_dry_run }}
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: publish-dist/
  publish-image:
    if: ${{ inputs.publish_image && !inputs.publish_pypi }}
    needs: [build, native]
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          python-version: '3.12'
      - run: uv sync --frozen
      - name: Select versioned image
        run: |
          release_version=$(uv run --frozen python -c 'from acp_gateway import __version__; print(__version__)')
          echo "ACPGW_RELEASE_IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}:$release_version" >> "$GITHUB_ENV"
      - run: docker build -t "$ACPGW_RELEASE_IMAGE" .
      - run: uv run --frozen python scripts/smoke_docker.py --image "$ACPGW_RELEASE_IMAGE"
      - name: Publish tested image
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          if docker manifest inspect "$ACPGW_RELEASE_IMAGE" >/dev/null 2>&1; then
            echo 'Version tag already exists; increment the package version instead of replacing it.' >&2
            exit 1
          fi
          docker push "$ACPGW_RELEASE_IMAGE"
      - name: Clear registry credentials
        if: ${{ always() }}
        run: docker logout ghcr.io
  native:
    if: ${{ !inputs.publish_pypi }}
    strategy:
      fail-fast: false
      matrix:
        runner: [windows-2025, macos-15, macos-15-intel, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          python-version: '3.12'
      - run: uv sync --frozen --group build
      - run: uv build --wheel --out-dir dist/native
      - run: uv run --frozen --group build python scripts/build_binary.py
      - run: uv run --frozen python scripts/smoke_platform.py --wheel-dir dist/native --built-binary
      - uses: actions/upload-artifact@v4
        with:
          name: acpgw-${{ matrix.runner }}
          path: |
            dist/*.tar.gz
            dist/*.sha256
            dist/*.build.json
          if-no-files-found: error
  build:
    if: ${{ !inputs.publish_pypi }}
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          python-version: '3.12'
      - run: uv sync --frozen --group build
      - run: uv run --frozen ruff check
      - run: uv run --frozen ruff format --check
      - run: uv run --frozen pytest
      - run: uv run --frozen --group build python scripts/build_binary.py
      - run: uv run --frozen python scripts/smoke_binary.py dist/acpgw-linux-x86_64/acpgw
      - run: uv run --frozen python scripts/smoke_connector.py dist/acpgw-linux-x86_64/acpgw
      - name: Check executable in Ubuntu without Python
        run: >-
          uv run --frozen python scripts/smoke_binary.py
          dist/acpgw-linux-x86_64/acpgw --container-image ubuntu:22.04
      - uses: actions/upload-artifact@v4
        with:
          name: acpgw-linux-x86_64
          path: |
            dist/*.tar.gz
            dist/*.sha256
            dist/*.build.json
          if-no-files-found: error
