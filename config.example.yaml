# ACP Gateway configuration. Copy to config.yaml (ignored by git) or to the
# platform config dir shown by `acpgw paths`. Secrets do not belong here:
# profiles name the environment variable (see .env.example) that holds them.

gateway:
  host: 127.0.0.1          # loopback only, enforced
  port: 8765
  api_token_env: ACPGW_API_TOKEN
  mcp_token_env: ACPGW_MCP_TOKEN

agents:
  # Topology "LAN": Work Goose on the work laptop, `goose serve --tls`.
  - alias: work            # prefix of MCP tools (work_ask, ...) and name in channels
    title: Work Goose
    kind: goose
    backend: remote
    url: wss://work-laptop.lan:3000/acp
    secret_env: AGENT_WORK_SECRET
    # SHA-256 from the GOOSED_CERT_FINGERPRINT=... line printed by goose serve.
    # Empty means trust-on-first-use.
    tls_fingerprint: ""
    default_cwd: /home/user/work
    # goose starts ACP sessions in "auto" (no approvals); the gateway switches
    # them to this mode. Default for goose profiles: smart_approve.
    session_mode: smart_approve

  # Topology "co-located": gateway on the same machine as goose serve.
  # - alias: work
  #   title: Work Goose
  #   kind: goose
  #   url: ws://127.0.0.1:3284/acp
  #   secret_env: AGENT_WORK_SECRET
  #   default_cwd: /home/user/work

policy:
  allow_new_sessions: true
  allow_cancel: true
  allow_approvals: true
  allow_always_approval: false
  allow_file_upload: false
  allow_file_download: false
  max_prompt_length: 50000
  max_response_length: 100000
  approval_timeout_seconds: 300
  approver_channels: [cli]

logging:
  level: INFO
  format: auto              # auto | console | json

# Development version 0.2.0rc2.dev0 and newer (not the frozen 0.2.0rc1 installer).
retention:
  jobs_days: 7
  approval_audit_days: null  # null keeps all decisions; e.g. 90 explicitly enables expiry
  sweep_interval_seconds: 3600
  batch_size: 1000          # maximum deletions per table per sweep

# Same development-version requirement as retention above.
rate_limits:
  work_requests: 60        # shared new-session/prompt attempts per channel
  window_seconds: 60

# Working source: normal setup/start prepares the independent updater for this
# role. Set enabled: false to opt out. Published 0.2.1 still uses the manual
# companion, so see docs/setup/updates-out-of-box.md and remote-updates.md.
updates:
  enabled: true
  # spool_dir: /absolute/private/update-spool  # default: data_dir/update-spool
